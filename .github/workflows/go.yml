name: Go
on: [push]

jobs:
  go_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: Install dependencies
        run: go get .
      - name: Test with the Go CLI
        run: go test -v ./...
